name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-bot:
    strategy:
      matrix:
        os: [ macos-26 ]
        include:
          - os: ubuntu-latest
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }} # zizmor: ignore[unpinned-images]
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@a657b8b0cd35d0f65cce41fce9b24cf054b49869 # 2026.08.24.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      - name: Validate the cask definition
        if: runner.os == 'macOS'
        run: |
          brew style --cask ArthurBrioche/cadre/cadre
          brew readall --aliases --os=all --arch=all ArthurBrioche/cadre
          brew livecheck --cask ArthurBrioche/cadre/cadre

      - name: Install and verify the signed app
        if: runner.os == 'macOS'
        env:
          CADRE_CI_APPDIR: ${{ runner.temp }}/cadre-apps
        run: |
          mkdir -p "$CADRE_CI_APPDIR"
          brew install --cask ArthurBrioche/cadre/cadre --appdir="$CADRE_CI_APPDIR"
          test -d "$CADRE_CI_APPDIR/Cadre.app"
          codesign --verify --deep --strict "$CADRE_CI_APPDIR/Cadre.app"
          spctl --assess --type execute "$CADRE_CI_APPDIR/Cadre.app"

      - name: Uninstall the cask
        if: always() && runner.os == 'macOS'
        run: |
          if brew list --cask cadre >/dev/null 2>&1; then
            brew uninstall --cask ArthurBrioche/cadre/cadre --force
          fi
